
name: static source code checks
# Called by the CI workflow so a build cannot go green — or publish — past a
# failing pre-commit hook. Not triggered on its own to avoid a duplicate run.
on:
  workflow_call:

jobs:
  static:
    env:
      PRIMARY_PYTHON_VERSION: '3.13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION  }}


      - name: Install uv environment
        uses: andgineer/uv-venv@v3

      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - run: pre-commit run --verbose --all-files
