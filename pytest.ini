[pytest]
addopts = --doctest-modules
# experiments/ is the sanctioned non-CI harness: it imports anki and llmbroker,
# which are not project dependencies, so a bare `pytest` must not collect it.
testpaths = tests
# The bench harness is imported by its own tests; declaring the path here keeps
# experiments/ from shadowing the stdlib for every module imported afterwards.
pythonpath = experiments
