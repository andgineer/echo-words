[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "echo-words"
dynamic = [ "version",]
description = "Turns words into rich linguistic insights and automatically adds them to your spaced repetition system."
keywords = [ "one", "two", ]
classifiers = [ "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.0",
    "rich-click>=1.8.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "llmbroker>=1.5.2",
    "anki==26.8.1",
    "edge-tts>=7.2.0",
    "lameenc>=1.8.1",
    "piper-tts>=1.3.0",
]
[[project.authors]]
name = "Andrey Sorokin"
email = "andrey@sorokin.engineer"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://andgineer.github.io/echo-words/"
Documentation = "https://andgineer.github.io/echo-words/"

[tool.setuptools]
packages = "find:"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.manifest]
include = [ "README.md", "LICENSE",]

[tool.ruff]
line-length = 100
# tasks.py and the experiments/ spikes are outside the product: the harnesses
# deliberately import non-dependencies and are never shipped or CI-tested.
exclude = ["tasks.py", "resources", "experiments"]

[tool.ruff.lint]
select = [
    "PL",   # all Pylint rules
    "A001", # shadowing Python builtins
    "ARG",  # unused function arguments
    "B",    # bugbear
    "BLE",  # blind except
    "C",    # complexity
    "COM",  # comma placement
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "G",    # logging format
    "I",    # import ordering
    "ISC",  # implicit string concatenation
    "N",    # naming
    "PIE",  # misc
    "Q",    # quotes
    "RET",  # return statements
    "S",    # security
    "SIM",  # simplification
    "SLF",  # private member access
    "TID",  # tidy imports
    "TRY",  # exception handling
    "UP",   # upgrade syntax
    "W",    # warnings
]
ignore = ["B019", "S101", "G004", "TRY003", "TRY300", "TRY301", "TRY400"]
# A test asserts against literal status codes and configuration defaults:
# naming them as constants would only restate the value being checked.
per-file-ignores = { "tests/*" = ["PLR2004"] }

[tool.hatch.version]
path = "src/echo_words/__about__.py"

[dependency-groups]
dev = [
    "allure-pytest>=2.14.2",
    "ruff>=0.16.0",
    "invoke>=2.2.0",
    "python-dotenv>=1.2.3",
    "tomli-w>=1.2.0",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "zensical>=0.0.41",
    "mkdocstrings[python]>=0.29.1",

    "pre-commit>=4.2.0",
    "pymdown-extensions>=10.15",
    "pyrefly>=0.50.0",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
]

[project.scripts]
echo-words = "echo_words.main:echo_words"
